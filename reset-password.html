<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nouveau mot de passe</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  background: #f7f7f5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  overflow-x: hidden;
}
.card {
  width: 100%;
  max-width: 380px;
  background: rgba(255,255,255,.92);
  border-radius: 30px;
  padding: 28px 24px;
  box-shadow: 0 25px 80px rgba(0,0,0,.12);
}
.logo {
  width: 110px;
  display: block;
  margin: 0 auto 18px;
}
h1 {
  font-size: 23px;
  line-height: 1.15;
  margin-bottom: 10px;
  color: #1d1d1f;
  white-space: nowrap;
}
p {
  color: #6e6e73;
  font-size: 15px;
  margin-bottom: 24px;
}
.field {
  margin-bottom: 14px;
}
label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}
input {
  width: 100%;
  border: 1px solid rgba(0,0,0,.12);
  border-radius: 16px;
  padding: 15px;
  font-size: 16px;
  outline: none;
  background: white;
}
input:focus {
  border-color: #111;
}
/* Champ mot de passe + oeil (même patron que sur index.html :
   toggleLoginPassword/toggleRegisterPassword) : input avec un padding-right
   pour laisser la place au bouton, positionné en absolu dedans. */
.password-wrap {
  position: relative;
}
.password-wrap input {
  padding-right: 44px;
}
.toggle-password {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: #8a8a8e;
  padding: 0;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color .15s ease;
}
.toggle-password:hover { color: #1d1d1f; }
.toggle-password svg { width: 19px; height: 19px; display: block; }
.error {
  color: #dc2626;
  font-size: 13px;
  margin: 6px 0 14px;
  display: none;
}
.btn-main {
  width: 100%;
  border: none;
  border-radius: 999px;
  background: #111;
  color: white;
  padding: 13px;
  font-size: 15px;
  font-weight: 700;
}
.btn-main:disabled {
  opacity: .35;
}

.btn-cancel {
  width: 100%;
  border: none;
  background: none;
  color: #8a8a8e;
  font-size: 14px;
  margin-top: 14px;
}
/* Champ email caché (autocomplete="username") : invisible à l'écran mais
   toujours présent dans le formulaire, pour que Safari/Chrome/le trousseau
   sache à quel compte associer le nouveau mot de passe proposé à
   l'enregistrement — un champ purement display:none est parfois ignoré par
   ces heuristiques, contrairement à cette technique "visually hidden". */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
/* Indicateur de force du mot de passe : purement visuel/indicatif côté
   client (heuristique simple), ne remplace pas la vérification côté
   serveur Supabase (mot de passe déjà connu comme piraté/trop faible),
   qui reste la seule source de vérité pour accepter ou refuser le mot
   de passe. */
.strength-meter {
  margin: -6px 0 14px;
  display: none;
}
.strength-bar {
  height: 4px;
  border-radius: 2px;
  background: rgba(0,0,0,.08);
  overflow: hidden;
}
.strength-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: 2px;
  background: #dc2626;
  transition: width .2s ease, background-color .2s ease;
}
.strength-label {
  font-size: 12px;
  margin-top: 5px;
  color: #8a8a8e;
}
</style>
</head>
<body>
<div class="card">
  <img src="https://i.imgur.com/1ZFTLIo.png" class="logo" alt="Clarity Systems">
  <h1>Nouveau mot de passe</h1>
  <p>Veuillez définir votre nouveau mot de passe.</p>
  <!-- Affiché à la place du formulaire quand le lien de réinitialisation
       est expiré ou déjà utilisé (les liens Supabase sont à usage unique) :
       évite de laisser taper un mot de passe pour échouer à la fin sans
       raison claire. Voir la vérification au chargement, plus bas. -->
  <div id="linkExpiredMessage" class="error" style="display:none;margin-bottom:0;">
    Ce lien a expiré ou a déjà été utilisé.<br>
    Redemandez un email de réinitialisation depuis la page de connexion.
  </div>
  <form id="resetPasswordForm" autocomplete="on">
  <!-- Champ email caché (autocomplete="username") : rempli en JS depuis la
       session de récupération déjà active sur cette page — sert uniquement
       à ce que le gestionnaire de mots de passe (trousseau iCloud, Chrome,
       etc.) sache à quel compte associer la proposition d'enregistrement.
       Jamais affiché, jamais modifiable. -->
  <input type="email" id="accountEmail" name="email" autocomplete="username" class="visually-hidden" readonly tabindex="-1" aria-hidden="true">
  <div class="field">
    <label>Mot de passe</label>
    <div class="password-wrap">
      <input id="newPassword" name="new-password" type="password" autocomplete="new-password" placeholder="8 caractères min. Évitez un mot de passe déjà utilisé ailleurs" oninput="checkPasswords()">
      <button type="button" class="toggle-password" id="toggleNewPassword" onclick="togglePasswordField('newPassword', 'toggleNewPassword')" aria-label="Afficher le mot de passe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="strength-meter" id="strengthMeter">
      <div class="strength-bar"><div class="strength-bar-fill" id="strengthBarFill"></div></div>
      <div class="strength-label" id="strengthLabel"></div>
    </div>
  </div>
  <div class="field">
    <label>Confirmation</label>
    <div class="password-wrap">
      <input id="confirmPassword" name="confirm-password" type="password" autocomplete="new-password" placeholder="Confirmer le mot de passe" oninput="checkPasswords()">
      <button type="button" class="toggle-password" id="toggleConfirmPassword" onclick="togglePasswordField('confirmPassword', 'toggleConfirmPassword')" aria-label="Afficher le mot de passe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
  <div id="passwordError" class="error"></div>
  <button id="updateBtn" type="submit" class="btn-main" disabled>
    Modifier mon mot de passe
  </button>
  <button type="button" class="btn-cancel" onclick="cancelReset()">
    Annuler
  </button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// IMPORTANT : cette section (œil + validation des champs) est mise
// délibérément TOUT EN HAUT du script, AVANT toute ligne touchant Supabase.
// Raison d'un vrai bug constaté : si window.supabase.createClient(...)
// plus bas lève une exception (CDN Supabase lent/bloqué, réseau mobile
// capricieux...), ça arrêtait l'exécution du script à cet endroit — et
// tout ce qui était déclaré APRÈS (dont l'icône de l'œil) ne s'initialisait
// jamais, même si la fonction togglePasswordField() restait appelable
// (les déclarations de fonction sont hoisted) : le mot de passe se
// démasquait bien, mais l'icône ne changeait jamais, silencieusement. En
// mettant cette logique tout en haut, elle fonctionne TOUJOURS, même si
// Supabase ne charge pas.
const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

// Oeil pour voir/masquer le mot de passe tapé — icônes SVG (pas d'emoji,
// pour un rendu plus "SaaS premium"). L'icône affichée est reconstruite en
// JS à chaque clic, DIRECTEMENT à partir de input.type (pas d'une classe
// CSS séparée à garder synchronisée) : ça élimine tout risque de
// désynchronisation entre l'icône affichée et l'état réel du champ.
function togglePasswordField(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  const willBeVisible = input.type === "password";
  input.type = willBeVisible ? "text" : "password";
  // Icône barrée = "actuellement visible, cliquez pour masquer" ; icône
  // ouverte = "actuellement masqué, cliquez pour afficher" — reconstruite
  // après le changement de type, donc toujours cohérente avec ce que
  // l'utilisateur voit réellement dans le champ.
  btn.innerHTML = willBeVisible ? ICON_EYE_OFF : ICON_EYE;
  btn.setAttribute("aria-label", willBeVisible ? "Masquer le mot de passe" : "Afficher le mot de passe");
}

// Indicateur de force purement indicatif (heuristique côté client) : aide
// l'utilisateur à choisir un mot de passe solide AVANT l'envoi, mais ne
// préjuge jamais de la décision finale — seule la vérification Supabase
// (mot de passe déjà connu comme piraté/trop simple) fait foi, et peut donc
// refuser un mot de passe même jugé "Bon" ici.
function getPasswordStrength(password) {
  let score = 0;
  if (password.length >= 8) score++;
  if (password.length >= 12) score++;
  if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
  if (/\d/.test(password)) score++;
  if (/[^A-Za-z0-9]/.test(password)) score++;
  score = Math.min(score, 4);
  const levels = [
    { label: "Trop court", color: "#dc2626" },
    { label: "Faible", color: "#dc2626" },
    { label: "Moyen", color: "#d97706" },
    { label: "Bon", color: "#16a34a" },
    { label: "Excellent", color: "#16a34a" }
  ];
  return Object.assign({ score: score }, levels[score]);
}

function updateStrengthMeter(password) {
  const meter = document.getElementById("strengthMeter");
  const fill = document.getElementById("strengthBarFill");
  const label = document.getElementById("strengthLabel");
  if (!meter || !fill || !label) return;
  if (!password) {
    meter.style.display = "none";
    return;
  }
  const s = getPasswordStrength(password);
  meter.style.display = "block";
  fill.style.width = (s.score / 4 * 100) + "%";
  fill.style.background = s.color;
  label.textContent = "Force du mot de passe : " + s.label;
  label.style.color = s.color;
}

function checkPasswords() {
  const password = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const error = document.getElementById("passwordError");
  const button = document.getElementById("updateBtn");
  error.style.display = "none";
  error.textContent = "";
  button.disabled = true;
  updateStrengthMeter(password);
  if (!password && !confirm) return;
  if (password.length < 8) {
    error.textContent = "Le mot de passe doit contenir au moins 8 caractères.";
    error.style.display = "block";
    return;
  }
  if (confirm && password !== confirm) {
    error.textContent = "Les deux mots de passe ne sont pas identiques.";
    error.style.display = "block";
    return;
  }
  if (password === confirm) {
    button.disabled = false;
  }
}

const SUPABASE_URL = "https://vduqkeodewrdwsqwokmu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkdXFrZW9kZXdyZHdzcXdva211Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTg3OTIsImV4cCI6MjA5NDMzNDc5Mn0.yNq6vHgxtDX3WCFBLUmLwp2kDSgMo4D-SBkZVptw3mo";
// try/catch : si le script Supabase (CDN) n'a pas fini de charger ou a été
// bloqué, cette ligne pouvait planter et emporter avec elle tout le reste
// du script (voir le commentaire tout en haut du fichier) — même si plus
// rien après ICON_EYE/togglePasswordField n'est concerné aujourd'hui, ce
// garde-fou évite qu'un futur ajout tombe dans le même piège.
let supabaseClient = null;
try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  console.error("Supabase indisponible :", e);
}

  let pageLoadedOnce = false;

window.addEventListener("load", () => {
  pageLoadedOnce = true;
});

// Vérification au chargement : les liens de réinitialisation Supabase sont
// à usage unique et expirent — sans ça, quelqu'un qui réutilise un ancien
// lien (ou un lien déjà cliqué une fois) tape tranquillement son nouveau
// mot de passe et ne découvre l'échec qu'au clic final, sans comprendre
// pourquoi. On vérifie donc dès l'arrivée sur la page qu'une vraie session
// de récupération existe, et on remplace le formulaire par un message clair
// sinon — plutôt que de laisser deviner.
function showLinkExpired() {
  const form = document.getElementById("resetPasswordForm");
  const msg = document.getElementById("linkExpiredMessage");
  if (form) form.style.display = "none";
  if (msg) msg.style.display = "block";
}

if (supabaseClient) {
  supabaseClient.auth.getSession().then(({ data }) => {
    if (!data || !data.session || !data.session.user) {
      showLinkExpired();
      return;
    }
    // Champ email caché (autocomplete="username") : rempli une fois la
    // session de récupération confirmée, pour que le gestionnaire de mots
    // de passe (trousseau, Chrome...) sache à quel compte associer la
    // proposition d'enregistrement du nouveau mot de passe. Jamais
    // bloquant : si ça échoue, le formulaire marche quand même.
    const emailField = document.getElementById("accountEmail");
    if (emailField && data.session.user.email) {
      emailField.value = data.session.user.email;
    }
  }).catch(() => { showLinkExpired(); });
} else {
  showLinkExpired();
}

// Vraie soumission de formulaire (plutôt qu'un simple onclick sur le
// bouton) : c'est ce qui permet à Safari/Chrome/au trousseau de proposer
// d'enregistrer le nouveau mot de passe, exactement comme sur les autres
// sites. preventDefault immédiat (on gère l'envoi nous-mêmes via Supabase,
// jamais un vrai POST de formulaire) ; le navigateur garde quand même la
// trace de cette soumission, et la navigation vers dashboard.html juste
// après un succès est ce qui déclenche concrètement la proposition
// d'enregistrement.
document.getElementById("resetPasswordForm").addEventListener("submit", function (e) {
  e.preventDefault();
  updatePassword();
});

async function updatePassword() {
  const button = document.getElementById("updateBtn");
  if (button.disabled) return;
  const password = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const error = document.getElementById("passwordError");
  if (password !== confirm) {
    error.textContent = "Les deux mots de passe ne sont pas identiques.";
    error.style.display = "block";
    return;
  }
  if (!supabaseClient) {
    error.textContent = "Connexion au service indisponible. Rechargez la page et réessayez.";
    error.style.display = "block";
    return;
  }
  const { error: updateError } = await supabaseClient.auth.updateUser({
    password: password
  });
  if (updateError) {
  // Message affiché adapté à la cause réelle plutôt qu'un "réessayez"
  // générique qui masquait le problème (lien expiré/déjà utilisé, mot de
  // passe déjà repéré comme piraté/trop faible par Supabase, etc.). Le
  // message brut de Supabase n'est JAMAIS affiché à l'utilisateur (il est
  // en anglais et peu clair) — seul un texte français explicite est montré
  // ; le message original reste disponible dans la console pour le
  // diagnostic technique (console.error ci-dessous).
  const msg = (updateError.message || "").toLowerCase();
  if (msg.includes("different from the old password")) {
    error.textContent = "Votre nouveau mot de passe doit être différent de l’ancien.";
  } else if (
    msg.includes("session") ||
    msg.includes("expired") ||
    msg.includes("invalid") ||
    updateError.status === 401 ||
    updateError.status === 403
  ) {
    error.textContent = "Ce lien a expiré ou a déjà été utilisé. Redemandez un email de réinitialisation depuis la page de connexion.";
  } else if (
    msg.includes("weak") ||
    msg.includes("pwned") ||
    msg.includes("breach") ||
    msg.includes("leaked") ||
    msg.includes("guess") ||
    msg.includes("known to be")
  ) {
    // Cas "Leaked password protection" de Supabase : le mot de passe fait
    // 8+ caractères (donc passe la règle de longueur affichée plus haut)
    // mais figure dans une base de mots de passe déjà compromis/trop
    // utilisés — c'est une vérification de sécurité normale, pas un bug.
    error.textContent = "Ce mot de passe est trop courant ou a déjà fuité lors d'une faille de sécurité ailleurs sur internet. Pour votre sécurité, Supabase le refuse même s'il fait plus de 8 caractères : choisissez un mot de passe plus original, idéalement que vous n'utilisez sur aucun autre site.";
  } else if (msg.includes("password") && (msg.includes("least") || msg.includes("character"))) {
    error.textContent = "Ce mot de passe ne respecte pas les critères de sécurité requis (longueur ou caractères autorisés).";
  } else {
    error.textContent = "Impossible de modifier le mot de passe. Veuillez réessayer dans quelques instants.";
  }

  error.style.display = "block";
  console.error(updateError);
  return;
}
  window.location.href = "dashboard.html";
}
async function cancelReset() {
  if (supabaseClient) {
    try { await supabaseClient.auth.signOut(); } catch (e) {}
  }
  window.location.href = "index.html";
}

  document.addEventListener('gesturestart', function(e) {
  e.preventDefault();
});

document.addEventListener('gesturechange', function(e) {
  e.preventDefault();
});

document.addEventListener('gestureend', function(e) {
  e.preventDefault();
});
</script>
</body>
</html>
