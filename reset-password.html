<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nouveau mot de passe</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  background: #f7f7f5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  overflow-x: hidden;
}
.card {
  width: 100%;
  max-width: 380px;
  background: rgba(255,255,255,.92);
  border-radius: 30px;
  padding: 28px 24px;
  box-shadow: 0 25px 80px rgba(0,0,0,.12);
}
.logo {
  width: 110px;
  display: block;
  margin: 0 auto 18px;
}
h1 {
  font-size: 23px;
  line-height: 1.15;
  margin-bottom: 10px;
  color: #1d1d1f;
  white-space: nowrap;
}
p {
  color: #6e6e73;
  font-size: 15px;
  margin-bottom: 24px;
}
.field {
  margin-bottom: 14px;
}
label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}
input {
  width: 100%;
  border: 1px solid rgba(0,0,0,.12);
  border-radius: 16px;
  padding: 15px;
  font-size: 16px;
  outline: none;
  background: white;
}
input:focus {
  border-color: #111;
}
/* Champ mot de passe + oeil (même patron que sur index.html :
   toggleLoginPassword/toggleRegisterPassword) : input avec un padding-right
   pour laisser la place au bouton, positionné en absolu dedans. */
.password-wrap {
  position: relative;
}
.password-wrap input {
  padding-right: 44px;
}
.toggle-password {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: #8a8a8e;
  padding: 0;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color .15s ease;
}
.toggle-password:hover { color: #1d1d1f; }
.toggle-password svg { width: 19px; height: 19px; display: block; }
.error {
  color: #dc2626;
  font-size: 13px;
  margin: 6px 0 14px;
  display: none;
}
.btn-main {
  width: 100%;
  border: none;
  border-radius: 999px;
  background: #111;
  color: white;
  padding: 13px;
  font-size: 15px;
  font-weight: 700;
}
.btn-main:disabled {
  opacity: .35;
}

.btn-cancel {
  width: 100%;
  border: none;
  background: none;
  color: #8a8a8e;
  font-size: 14px;
  margin-top: 14px;
}
/* Champ email caché (autocomplete="username") : invisible à l'écran mais
   toujours présent dans le formulaire, pour que Safari/Chrome/le trousseau
   sache à quel compte associer le nouveau mot de passe proposé à
   l'enregistrement — un champ purement display:none est parfois ignoré par
   ces heuristiques, contrairement à cette technique "visually hidden". */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
</style>
</head>
<body>
<div class="card">
  <img src="https://i.imgur.com/1ZFTLIo.png" class="logo" alt="Clarity Systems">
  <h1>Nouveau mot de passe</h1>
  <p>Veuillez définir votre nouveau mot de passe.</p>
  <form id="resetPasswordForm" autocomplete="on">
  <!-- Champ email caché (autocomplete="username") : rempli en JS depuis la
       session de récupération déjà active sur cette page — sert uniquement
       à ce que le gestionnaire de mots de passe (trousseau iCloud, Chrome,
       etc.) sache à quel compte associer la proposition d'enregistrement.
       Jamais affiché, jamais modifiable. -->
  <input type="email" id="accountEmail" name="email" autocomplete="username" class="visually-hidden" readonly tabindex="-1" aria-hidden="true">
  <div class="field">
    <label>Mot de passe</label>
    <div class="password-wrap">
      <input id="newPassword" name="new-password" type="password" autocomplete="new-password" placeholder="Minimum 8 caractères" oninput="checkPasswords()">
      <button type="button" class="toggle-password" id="toggleNewPassword" onclick="togglePasswordField('newPassword', 'toggleNewPassword')" aria-label="Afficher le mot de passe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
  <div class="field">
    <label>Confirmation</label>
    <div class="password-wrap">
      <input id="confirmPassword" name="confirm-password" type="password" autocomplete="new-password" placeholder="Confirmer le mot de passe" oninput="checkPasswords()">
      <button type="button" class="toggle-password" id="toggleConfirmPassword" onclick="togglePasswordField('confirmPassword', 'toggleConfirmPassword')" aria-label="Afficher le mot de passe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
  <div id="passwordError" class="error"></div>
  <button id="updateBtn" type="submit" class="btn-main" disabled>
    Modifier mon mot de passe
  </button>
  <button type="button" class="btn-cancel" onclick="cancelReset()">
    Annuler
  </button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// IMPORTANT : cette section (œil + validation des champs) est mise
// délibérément TOUT EN HAUT du script, AVANT toute ligne touchant Supabase.
// Raison d'un vrai bug constaté : si window.supabase.createClient(...)
// plus bas lève une exception (CDN Supabase lent/bloqué, réseau mobile
// capricieux...), ça arrêtait l'exécution du script à cet endroit — et
// tout ce qui était déclaré APRÈS (dont l'icône de l'œil) ne s'initialisait
// jamais, même si la fonction togglePasswordField() restait appelable
// (les déclarations de fonction sont hoisted) : le mot de passe se
// démasquait bien, mais l'icône ne changeait jamais, silencieusement. En
// mettant cette logique tout en haut, elle fonctionne TOUJOURS, même si
// Supabase ne charge pas.
const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

// Oeil pour voir/masquer le mot de passe tapé — icônes SVG (pas d'emoji,
// pour un rendu plus "SaaS premium"). L'icône affichée est reconstruite en
// JS à chaque clic, DIRECTEMENT à partir de input.type (pas d'une classe
// CSS séparée à garder synchronisée) : ça élimine tout risque de
// désynchronisation entre l'icône affichée et l'état réel du champ.
function togglePasswordField(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  const willBeVisible = input.type === "password";
  input.type = willBeVisible ? "text" : "password";
  // Icône barrée = "actuellement visible, cliquez pour masquer" ; icône
  // ouverte = "actuellement masqué, cliquez pour afficher" — reconstruite
  // après le changement de type, donc toujours cohérente avec ce que
  // l'utilisateur voit réellement dans le champ.
  btn.innerHTML = willBeVisible ? ICON_EYE_OFF : ICON_EYE;
  btn.setAttribute("aria-label", willBeVisible ? "Masquer le mot de passe" : "Afficher le mot de passe");
}

function checkPasswords() {
  const password = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const error = document.getElementById("passwordError");
  const button = document.getElementById("updateBtn");
  error.style.display = "none";
  error.textContent = "";
  button.disabled = true;
  if (!password && !confirm) return;
  if (password.length < 8) {
    error.textContent = "Le mot de passe doit contenir au moins 8 caractères.";
    error.style.display = "block";
    return;
  }
  if (confirm && password !== confirm) {
    error.textContent = "Les deux mots de passe ne sont pas identiques.";
    error.style.display = "block";
    return;
  }
  if (password === confirm) {
    button.disabled = false;
  }
}

const SUPABASE_URL = "https://vduqkeodewrdwsqwokmu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkdXFrZW9kZXdyZHdzcXdva211Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTg3OTIsImV4cCI6MjA5NDMzNDc5Mn0.yNq6vHgxtDX3WCFBLUmLwp2kDSgMo4D-SBkZVptw3mo";
// try/catch : si le script Supabase (CDN) n'a pas fini de charger ou a été
// bloqué, cette ligne pouvait planter et emporter avec elle tout le reste
// du script (voir le commentaire tout en haut du fichier) — même si plus
// rien après ICON_EYE/togglePasswordField n'est concerné aujourd'hui, ce
// garde-fou évite qu'un futur ajout tombe dans le même piège.
let supabaseClient = null;
try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  console.error("Supabase indisponible :", e);
}

  let pageLoadedOnce = false;

window.addEventListener("load", () => {
  pageLoadedOnce = true;
});

// Champ email caché (autocomplete="username") : rempli dès que la session
// de récupération (déjà active via le lien reçu par mail) est disponible,
// pour que le gestionnaire de mots de passe (trousseau, Chrome...) sache à
// quel compte associer la proposition d'enregistrement du nouveau mot de
// passe. Jamais bloquant : si ça échoue, le formulaire marche quand même.
if (supabaseClient) {
  supabaseClient.auth.getUser().then(({ data }) => {
    const emailField = document.getElementById("accountEmail");
    if (emailField && data && data.user && data.user.email) {
      emailField.value = data.user.email;
    }
  }).catch(() => {});
}

// Vraie soumission de formulaire (plutôt qu'un simple onclick sur le
// bouton) : c'est ce qui permet à Safari/Chrome/au trousseau de proposer
// d'enregistrer le nouveau mot de passe, exactement comme sur les autres
// sites. preventDefault immédiat (on gère l'envoi nous-mêmes via Supabase,
// jamais un vrai POST de formulaire) ; le navigateur garde quand même la
// trace de cette soumission, et la navigation vers dashboard.html juste
// après un succès est ce qui déclenche concrètement la proposition
// d'enregistrement.
document.getElementById("resetPasswordForm").addEventListener("submit", function (e) {
  e.preventDefault();
  updatePassword();
});

async function updatePassword() {
  const button = document.getElementById("updateBtn");
  if (button.disabled) return;
  const password = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const error = document.getElementById("passwordError");
  if (password !== confirm) {
    error.textContent = "Les deux mots de passe ne sont pas identiques.";
    error.style.display = "block";
    return;
  }
  if (!supabaseClient) {
    error.textContent = "Connexion au service indisponible. Rechargez la page et réessayez.";
    error.style.display = "block";
    return;
  }
  const { error: updateError } = await supabaseClient.auth.updateUser({
    password: password
  });
  if (updateError) {
  if (updateError.message.includes("different from the old password")) {
    error.textContent = "Votre nouveau mot de passe doit être différent de l’ancien.";
  } else {
    error.textContent = "Impossible de modifier le mot de passe. Veuillez réessayer.";
  }

  error.style.display = "block";
  console.error(updateError);
  return;
}
  window.location.href = "dashboard.html";
}
async function cancelReset() {
  if (supabaseClient) {
    try { await supabaseClient.auth.signOut(); } catch (e) {}
  }
  window.location.href = "index.html";
}

  document.addEventListener('gesturestart', function(e) {
  e.preventDefault();
});

document.addEventListener('gesturechange', function(e) {
  e.preventDefault();
});

document.addEventListener('gestureend', function(e) {
  e.preventDefault();
});
</script>
</body>
</html>
